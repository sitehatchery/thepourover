# Local development virtual host for https://cdp.local (WAMP / Apache 2.4).
# Requires mod_ssl, mod_proxy, mod_proxy_http and mod_rewrite.
# Serves the built React app (frontend/dist) and forwards API calls to FastAPI on port 8000.
# Adjust the certificate paths to wherever the local certificate was generated.

<VirtualHost *:80>
    ServerName cdp.local
    Redirect permanent / https://cdp.local/
</VirtualHost>

<VirtualHost *:443>
    ServerName cdp.local
    DocumentRoot "C:/wamp64/www/thepourover/frontend/dist"

    SSLEngine on
    SSLCertificateFile    "C:/wamp64/bin/apache/certs/cdp.local.crt"
    SSLCertificateKeyFile "C:/wamp64/bin/apache/certs/cdp.local.key"

    ProxyPreserveHost On
    ProxyPass        /app/      http://127.0.0.1:8000/app/
    ProxyPassReverse /app/      http://127.0.0.1:8000/app/
    ProxyPass        /webhooks/ http://127.0.0.1:8000/webhooks/
    ProxyPassReverse /webhooks/ http://127.0.0.1:8000/webhooks/

    <Directory "C:/wamp64/www/thepourover/frontend/dist">
        Require local
        Options -Indexes
        # Single-page app: unknown paths load index.html so client-side routes work on refresh.
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.html [L]
    </Directory>
</VirtualHost>
