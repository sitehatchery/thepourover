# Local development virtual host for https://cdp.local (WAMP / Apache 2.4).
# Paste into C:\wamp64\bin\apache\apache2.4.59\conf\extra\httpd-vhosts.conf.
# Requires mod_ssl, mod_rewrite, mod_proxy and mod_proxy_http.
# Serves the built React app (frontend/dist) and forwards API calls to FastAPI on port 8000.
# Certificate made with: mkcert -cert-file c:/wamp64/ssl/cdp.local.pem -key-file c:/wamp64/ssl/cdp.local-key.pem cdp.local

<VirtualHost *:80>
	ServerName cdp.local
	Redirect permanent / https://cdp.local/
</VirtualHost>
#
<VirtualHost *:443>
	ServerName cdp.local
	DocumentRoot "c:/wamp64/www/thepourover/frontend/dist"

	SSLEngine on
	SSLCertificateFile "c:/wamp64/ssl/cdp.local.pem"
	SSLCertificateKeyFile "c:/wamp64/ssl/cdp.local-key.pem"

	# API and webhook go to FastAPI (uvicorn) on port 8000.
	ProxyPreserveHost On
	ProxyPass        /app/      http://127.0.0.1:8000/app/
	ProxyPassReverse /app/      http://127.0.0.1:8000/app/
	ProxyPass        /webhooks/ http://127.0.0.1:8000/webhooks/
	ProxyPassReverse /webhooks/ http://127.0.0.1:8000/webhooks/
	<Proxy "http://127.0.0.1:8000/*">
		Require local
	</Proxy>

	<Directory "c:/wamp64/www/thepourover/frontend/dist/">
		Options -Indexes
		AllowOverride None
		Require local
		# Single-page app: unknown paths load index.html so client-side routes survive a refresh.
		RewriteEngine On
		RewriteCond %{REQUEST_FILENAME} !-f
		RewriteRule ^ index.html [L]
	</Directory>
</VirtualHost>
